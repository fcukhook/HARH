<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Small Surprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Parisienne&family=Playfair+Display:wght@500;600;700&family=Caveat:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="experience" aria-live="polite">
    <audio id="surprise-music" loop preload="auto" aria-hidden="true">
      <source src="JI.mp3" type="audio/mpeg" />
    </audio>

    <section class="screen screen--intro is-visible" data-screen="intro">
      <div class="intro-content">
        <p class="intro-text" id="intro-text"></p>
        <button class="button" type="button" data-action="next">Next</button>
      </div>
    </section>

    <section class="screen screen--prelude" data-screen="prelude" aria-hidden="true">
      <button class="start-button" type="button" data-action="start">Tap to Start</button>
    </section>

    <section class="screen screen--letter" data-screen="letter" aria-hidden="true">
      <article class="letter-card">
        <h1 id="letter-title"></h1>
        <div class="letter-copy" id="letter-copy"></div>
        <p class="signature" id="letter-signature"></p>
      </article>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
